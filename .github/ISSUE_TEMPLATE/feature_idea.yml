name: Feature idea
description: A new simulation layer, a balance change, or a chart/editor improvement
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What should the world be able to do that it cannot do today?
    validations:
      required: true
  - type: textarea
    id: emergent
    attributes:
      label: What makes it emerge rather than fire on cue?
      description: >
        New behaviour here is a system that reacts to existing state, never a scripted
        event. Which existing state would it read, which actor would decide, and what
        would the consequences be for everything downstream?
    validations:
      required: true
  - type: textarea
    id: omniscience
    attributes:
      label: What does the deciding actor know?
      description: >
        No actor is omniscient: cross-island reads go through that actor's own
        ship-carried beliefs, which can be stale or wrong. What information would this
        one have, and how would it have got it?
