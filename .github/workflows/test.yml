name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # Pin a concrete 22.x so the built-in node:sqlite (added 22.5, used by the
          # durable world chronicle in server/chronicle.js) is guaranteed present.
          node-version: 22.14
      - run: npm ci
      - run: npm test
      # Boots every page in headless Chrome (preinstalled on the runner) and
      # fails on any console error. Skips gracefully if no browser is found.
      - run: npm run smoke
