<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BOATZ — portrait preview grid</title>
  <style>
    /* Dev-only harness (not part of the game): a grid of captain/magistrate portraits across
       role flavors (rows) and seeds (columns), so the vector art can be iterated visually.
       Served by the same static mount as the game; imports PortraitRenderer directly. */
    html, body { margin: 0; padding: 0; background: #2a2622; color: #e9dcbb;
      font-family: system-ui, sans-serif; }
    #bar { padding: 10px 14px; display: flex; gap: 12px; align-items: center; }
    #bar button { font: inherit; background: #4a3f33; color: #e9dcbb; border: 1px solid #6a5c48;
      border-radius: 6px; padding: 4px 12px; cursor: pointer; }
    #bar .hint { opacity: 0.6; font-size: 13px; }
    #grid { display: block; }
  </style>
</head>
<body>
  <div id="bar">
    <strong>Portrait preview</strong>
    <button id="reseed">Reseed (Space)</button>
    <span class="hint">rows = role flavor · columns = same seed across flavors</span>
  </div>
  <canvas id="grid"></canvas>
  <script type="module" src="/game/portrait-preview.js"></script>
</body>
</html>
